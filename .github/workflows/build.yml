name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Environment Secrets (.env)
        run: |
          if [ -n "${{ secrets.BINDERBYTE_API_KEY }}" ]; then
            echo "BINDERBYTE_API_KEY=${{ secrets.BINDERBYTE_API_KEY }}" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "BINDERBYTE_API_KEY=sk_ukzjkodsvczygs27xuvqwqi5fxvowgo0cy31twm9pkj5rbwgyqoojxvfvpng5iwl" > .env
          fi

      - name: Prepare Signing Keystore
        id: setup-keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Menggunakan Keystore dari GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          elif [ -f my-upload-key.jks ]; then
            echo "Menggunakan Keystore my-upload-key.jks yang ada..."
          elif [ -f my-upload-key.jks.base64 ]; then
            echo "Mendekode dari my-upload-key.jks.base64..."
            base64 -d my-upload-key.jks.base64 > my-upload-key.jks
          else
            echo "Membuat Keystore otomatis untuk rilis..."
            keytool -genkeypair \
              -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass lacakpaket123 \
              -keypass lacakpaket123 \
              -dname "CN=LacakPaket, OU=Logistics, O=LacakPaket Studio, L=Jakarta, ST=DKI Jakarta, C=ID"
          fi

      - name: Ensure Gradle Wrapper Exists & Executable
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper || true
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'lacakpaket123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'lacakpaket123' }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Build Release AAB (Android App Bundle for Play Store)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'lacakpaket123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'lacakpaket123' }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew bundleRelease --stacktrace
          else
            gradle :app:bundleRelease --stacktrace
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LacakPaket-Release-APK
          path: app/build/outputs/apk/release/*-release.apk
          retention-days: 14

      - name: Upload Release AAB Artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: LacakPaket-Release-AAB
          path: app/build/outputs/bundle/release/*-release.aab
          retention-days: 14
